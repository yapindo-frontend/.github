# Type check, lint and unit tests for a pnpm, bun or npm project.
# Each script runs only when package.json defines it. No build: Vercel builds on deploy.
#
# Caller:
#   check:
#     uses: yapindo-frontend/.github/.github/workflows/ci.yml@v1
#     with:
#       pm: pnpm                              # pnpm | bun | npm
#       scripts: check lint test:unit         # optional
name: CI

on:
  workflow_call:
    inputs:
      pm:
        description: Package manager (pnpm, bun or npm)
        type: string
        default: pnpm
      scripts:
        description: package.json scripts to run, space-separated, skipped when missing
        type: string
        default: check lint test:unit

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Needs "packageManager" in package.json.
      - if: inputs.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: inputs.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: inputs.pm != 'bun'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ inputs.pm }}

      # SvelteKit's $env/static/* imports fail the type check without a .env.
      - run: '[ -f .env.example ] && [ ! -f .env ] && cp .env.example .env || true'

      - name: Install
        env:
          PM: ${{ inputs.pm }}
        run: |
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "::error::Unknown package manager: $PM"; exit 1 ;;
          esac

      - name: Run the scripts that exist
        env:
          PM: ${{ inputs.pm }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for s in $SCRIPTS; do
            if node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$s"; then
              echo "::group::$s"
              "$PM" run "$s"
              echo "::endgroup::"
            else
              echo "No \"$s\" script, skipped."
            fi
          done
