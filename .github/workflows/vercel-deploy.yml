# Deploys one or more Vercel projects from GitHub Actions with the team's token.
# Commit authors don't need a Vercel seat: the deploy is created by the token owner.
#
# Caller:
#   deploy:
#     uses: yapindo-frontend/.github/.github/workflows/vercel-deploy.yml@v1
#     with:
#       team: yapindo-fe-s-team            # or yapindo-frontend-2
#       projects: '["neo-bootcamp"]'       # JSON array of Vercel project names
#       production-branch: master          # optional, see below
#     secrets: inherit                     # needs VERCEL_TOKEN for that team; REVIEWER_APP_KEY
#                                          # (optional) for the pull request comment
#
# A push deploys to production; any other event (pull_request) makes a preview.
# With production-branch set, only a push to that branch goes to production. A push to
# any other branch deploys only if the Vercel project has somewhere for it:
#   - a custom environment named like the branch (e.g. "dev"): it deploys there, and
#     Vercel moves that environment's domains onto it;
#   - otherwise domains assigned to the branch (set while the Git integration was on):
#     it makes a preview and moves those domains onto it.
# So a caller can listen to pushes on every branch, and creating a custom environment
# named after the branch, with its domain, in Vercel is all it takes.
#
# Each deploy writes its address to the job summary. A preview or staging deploy also
# gets a shareable link, which opens it without a Vercel seat, and a pull request gets
# one comment per project with both, updated on every push.
name: Vercel deploy

on:
  workflow_call:
    inputs:
      team:
        description: Vercel team slug (yapindo-fe-s-team or yapindo-frontend-2)
        type: string
        required: true
      projects:
        description: JSON array of Vercel project names to deploy
        type: string
        required: true
      production-branch:
        description: The branch whose pushes deploy to production. Empty means every push does.
        type: string
        default: ''
    secrets:
      VERCEL_TOKEN:
        required: true
      REVIEWER_APP_KEY:
        description: Private key of the YapReview GitHub App, which writes the pull request comment
        required: false

permissions: {}

jobs:
  deploy:
    name: Deploy ${{ matrix.project }}
    # The org's self-hosted runner unless the calling repo sets the variable RUNNER
    # (e.g. ubuntu-latest while hosted minutes are left).
    # The job only uploads; Vercel builds.
    runs-on: ${{ vars.RUNNER || fromJSON('["self-hosted","vercel"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    env:
      T: ${{ secrets.VERCEL_TOKEN }}
      PROD: ${{ github.event_name == 'push' && (inputs.production-branch == '' || github.ref_name == inputs.production-branch) && '--prod' || '' }}
      # A push to a branch other than production, whose domains must follow it.
      BRANCH_PUSH: ${{ github.event_name == 'push' && inputs.production-branch != '' && github.ref_name != inputs.production-branch }}
      TEAM: ${{ inputs.team }}
      PROJECT: ${{ matrix.project }}
      HAS_APP_KEY: ${{ secrets.REVIEWER_APP_KEY != '' }}
    steps:
      # Vercel's Git integration moved branch domains; CLI deploys carry no branch, so do it here.
      - name: Find where the branch deploys
        id: domains
        if: env.BRANCH_PUSH == 'true'
        run: |
          api=https://api.vercel.com
          auth="Authorization: Bearer $T"
          env=$(curl -fsS -H "$auth" "$api/v9/projects/$PROJECT/custom-environments?slug=$TEAM" |
            jq -r --arg b "$GITHUB_REF_NAME" '[.environments[] | select(.slug == $b) | .slug][0] // empty')
          if [ -n "$env" ]; then
            echo "Custom environment $env"
            echo "TARGET=--target=$env" >> "$GITHUB_ENV"
            exit 0
          fi
          names=$(curl -fsS -H "$auth" "$api/v9/projects/$PROJECT/domains?slug=$TEAM&limit=100" |
            jq -r --arg b "$GITHUB_REF_NAME" '[.domains[] | select(.gitBranch == $b) | .name] | join(" ")')
          echo "${names:-No custom environment or domain for $GITHUB_REF_NAME, nothing to deploy}"
          echo "names=$names" >> "$GITHUB_OUTPUT"
          [ -n "$names" ] || echo "SKIP=true" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SKIP != 'true'
        with:
          node-version: 24

      # Without git metadata Vercel can't match the commit author to a team member,
      # which is what blocks deploys by people without a seat (CLI deploys included).
      - if: env.SKIP != 'true'
        run: rm -rf .git

      - name: Link the Vercel project
        if: env.SKIP != 'true'
        run: npx -y vercel@latest link --yes --project "$PROJECT" --scope "$TEAM" --token "$T"

      # No --prebuilt: Vercel builds, so this job costs no build minutes here.
      # --meta keeps who and what triggered the deploy, since the creator is always the token owner.
      - name: Deploy
        id: deploy
        if: env.SKIP != 'true'
        run: |
          url=$(npx -y vercel@latest deploy $PROD $TARGET --token "$T" \
            --meta actor="$GITHUB_ACTOR" \
            --meta triggeredBy="$GITHUB_TRIGGERING_ACTOR" \
            --meta repo="$GITHUB_REPOSITORY" \
            --meta ref="$GITHUB_REF_NAME" \
            --meta sha="$GITHUB_SHA" \
            --meta run="$GITHUB_RUN_ID")
          echo "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Move the branch's domains to this deploy
        if: steps.domains.outputs.names != '' && env.SKIP != 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          DOMAINS: ${{ steps.domains.outputs.names }}
        run: |
          api=https://api.vercel.com
          auth="Authorization: Bearer $T"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${URL#https://}?slug=$TEAM" | jq -r .id)
          # The API, unlike `vercel alias set`, also takes a project's domains owned outside the team.
          for d in $DOMAINS; do
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"alias\":\"$d\"}" "$api/v2/deployments/$id/aliases?slug=$TEAM"
            echo; echo "$d -> $URL"
          done

      # Previews are behind Vercel Authentication, which opens only for the Vercel team's
      # seats; a shareable link lets in anyone who has it. One per deployment, 30 days.
      - name: Create a share link
        id: share
        if: env.SKIP != 'true' && env.PROD == ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          api=https://api.vercel.com
          auth="Authorization: Bearer $T"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${URL#https://}?slug=$TEAM" | jq -r .id)
          secret=$(curl -sS -X PATCH -H "$auth" -H "Content-Type: application/json" -d '{"ttl":2592000}' \
            "$api/aliases/$id/protection-bypass?slug=$TEAM" |
            jq -r '[.protectionBypass // {} | to_entries[] | select(.value.scope == "shareable-link")] | max_by(.value.createdAt) | .key // empty')
          if [ -n "$secret" ]; then echo "url=$URL/?_vercel_share=$secret" >> "$GITHUB_OUTPUT"; else echo "No share link"; fi

      - name: Write the summary
        if: env.SKIP != 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHARE: ${{ steps.share.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          kind=Preview
          [ -n "$PROD" ] && kind=Production
          [ -n "${TARGET:-}" ] && kind="Staging (${TARGET#--target=})"
          {
            echo "| $kind | \`$PROJECT\` |"
            echo "| --- | --- |"
            echo "| Alamat | $URL |"
            [ -n "$SHARE" ] && echo "| Tanpa akun Vercel | [Buka lewat share link]($SHARE) (berlaku 30 hari) |"
            echo "| Commit | [\`${SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA) oleh $GITHUB_ACTOR · [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
          } > "$RUNNER_TEMP/deploy-summary.md"
          cat "$RUNNER_TEMP/deploy-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # The comment comes from yapreview[bot], whose key is already in every repository, so
      # it doesn't depend on what the caller's GITHUB_TOKEN may do (read-only by default
      # once the organization tightens it).
      - name: Token for the pull request comment
        id: app
        if: env.SKIP != 'true' && github.event_name == 'pull_request' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23li42QnUpk2HKQHot
          private-key: ${{ secrets.REVIEWER_APP_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Comment on the pull request
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One comment per project, found by its marker and updated on every push.
          marker="<!-- vercel-deploy:$PROJECT -->"
          body="$marker
          $(cat "$RUNNER_TEMP/deploy-summary.md")"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" --silent
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" --silent
          fi
