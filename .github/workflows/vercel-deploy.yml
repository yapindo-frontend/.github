# Deploys one or more Vercel projects from GitHub Actions with the team's token.
# Commit authors don't need a Vercel seat: the deploy is created by the token owner.
#
# Caller:
#   deploy:
#     uses: yapindo-frontend/.github/.github/workflows/vercel-deploy.yml@v1
#     with:
#       team: yapindo-fe-s-team            # or yapindo-frontend-2
#       projects: '["neo-bootcamp"]'       # JSON array of Vercel project names
#       production-branch: master          # optional, see below
#     secrets: inherit                     # needs VERCEL_TOKEN for that team
#
# A push deploys to production; any other event (pull_request) makes a preview.
# With production-branch set, only a push to that branch goes to production. A push to
# any other branch makes a preview and moves that branch's domains (the project's
# domains assigned to the branch, such as a staging domain for dev) onto it.
name: Vercel deploy

on:
  workflow_call:
    inputs:
      team:
        description: Vercel team slug (yapindo-fe-s-team or yapindo-frontend-2)
        type: string
        required: true
      projects:
        description: JSON array of Vercel project names to deploy
        type: string
        required: true
      production-branch:
        description: The branch whose pushes deploy to production. Empty means every push does.
        type: string
        default: ''
    secrets:
      VERCEL_TOKEN:
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy ${{ matrix.project }}
    # The org's self-hosted runner unless the calling repo sets the variable RUNNER
    # (e.g. ubuntu-latest while hosted minutes are left).
    # The job only uploads; Vercel builds.
    runs-on: ${{ vars.RUNNER || fromJSON('["self-hosted","vercel"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    env:
      T: ${{ secrets.VERCEL_TOKEN }}
      PROD: ${{ github.event_name == 'push' && (inputs.production-branch == '' || github.ref_name == inputs.production-branch) && '--prod' || '' }}
      # A push to a branch other than production, whose domains must follow it.
      BRANCH_PUSH: ${{ github.event_name == 'push' && inputs.production-branch != '' && github.ref_name != inputs.production-branch }}
      TEAM: ${{ inputs.team }}
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Without git metadata Vercel can't match the commit author to a team member,
      # which is what blocks deploys by people without a seat (CLI deploys included).
      - run: rm -rf .git

      - name: Link the Vercel project
        run: npx -y vercel@latest link --yes --project "$PROJECT" --scope "$TEAM" --token "$T"

      # No --prebuilt: Vercel builds, so this job costs no build minutes here.
      # --meta keeps who and what triggered the deploy, since the creator is always the token owner.
      - name: Deploy
        id: deploy
        run: |
          url=$(npx -y vercel@latest deploy $PROD --token "$T" \
            --meta actor="$GITHUB_ACTOR" \
            --meta triggeredBy="$GITHUB_TRIGGERING_ACTOR" \
            --meta repo="$GITHUB_REPOSITORY" \
            --meta ref="$GITHUB_REF_NAME" \
            --meta sha="$GITHUB_SHA" \
            --meta run="$GITHUB_RUN_ID")
          echo "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Vercel's Git integration used to do this; CLI deploys carry no branch, so do it here.
      - name: Move the branch's domains to this deploy
        if: env.BRANCH_PUSH == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          api=https://api.vercel.com
          auth="Authorization: Bearer $T"
          domains=$(curl -fsS -H "$auth" "$api/v9/projects/$PROJECT/domains?slug=$TEAM&limit=100" |
            jq -r --arg b "$GITHUB_REF_NAME" '.domains[] | select(.gitBranch == $b) | .name')
          [ -n "$domains" ] || { echo "No domain is assigned to $GITHUB_REF_NAME"; exit 0; }
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${URL#https://}?slug=$TEAM" | jq -r .id)
          # The API, unlike `vercel alias set`, also takes a project's domains owned outside the team.
          for d in $domains; do
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"alias\":\"$d\"}" "$api/v2/deployments/$id/aliases?slug=$TEAM"
            echo; echo "$d -> $URL"
          done
