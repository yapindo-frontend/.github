# YapReview: Claude reviews a pull request and comments as yapreview[bot],
# following review/REVIEWER.md in this repository.
#
# Caller (review on "ready for review" or when the "ai-review" label is added):
#   on:
#     pull_request:
#       types: [ready_for_review, labeled]
#   jobs:
#     review:
#       if: github.event.action == 'ready_for_review' || github.event.label.name == 'ai-review'
#       uses: yapindo-frontend/.github/.github/workflows/ai-review.yml@v1
#       secrets: inherit                      # needs REVIEWER_APP_KEY, CLAUDE_CODE_OAUTH_TOKEN
name: AI review

on:
  workflow_call:
    secrets:
      REVIEWER_APP_KEY:
        description: Private key of the YapReview GitHub App
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Token from `claude setup-token` on the office Claude subscription
        required: true

permissions: {}

jobs:
  review:
    name: YapReview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Token for the current repository only, as yapreview[bot].
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: Iv23li42QnUpk2HKQHot
          private-key: ${{ secrets.REVIEWER_APP_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yapindo-frontend/.github
          path: .yapreview
          sparse-checkout: review
          persist-credentials: false

      - name: Load the reviewer guidelines
        id: guide
        run: |
          {
            echo 'text<<EOF_REVIEWER_GUIDE'
            cat .yapreview/review/REVIEWER.md
            echo 'EOF_REVIEWER_GUIDE'
          } >> "$GITHUB_OUTPUT"
          rm -rf .yapreview

      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            ${{ steps.guide.outputs.text }}

            ---

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following the guidelines above.
            The PR is checked out in the working directory; read other files when you need context.
            Post the summary with `gh pr comment`.
            Post findings on specific lines with `mcp__github_inline_comment__create_inline_comment` (confirmed: true).
            Only post GitHub comments; don't answer with the review as text.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
