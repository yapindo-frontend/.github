name: Tugas Teknis
description: Pekerjaan teknis tanpa perubahan perilaku (dependensi, CI, infrastruktur, utang teknis)
title: '[Tugas]: '
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: Deskripsi
      description: Apa yang perlu dikerjakan, dan kenapa?
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: textarea
    id: notes
    attributes:
      label: Catatan
      description: Risiko, ketergantungan, atau tautan terkait.
