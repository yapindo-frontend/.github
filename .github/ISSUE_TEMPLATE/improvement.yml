name: Peningkatan
description: Perbaiki fitur yang sudah ada (UX, tampilan, performa, atau teks)
title: '[Peningkatan]: '
labels: ['improvement', 'needs-triage']
body:
  - type: dropdown
    id: kind
    attributes:
      label: Jenis Peningkatan
      options:
        - UX / Alur Pengguna
        - Tampilan / UI
        - Performa
        - Aksesibilitas
        - Copy / Teks
        - Lainnya
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Kondisi Saat Ini
      description: Bagaimana fitur ini berjalan sekarang, dan apa kekurangannya?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Usulan Perubahan
      description: Seperti apa seharusnya?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL Halaman
      placeholder: https://...

  - type: textarea
    id: acceptance
    attributes:
      label: Kriteria Penerimaan
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: textarea
    id: references
    attributes:
      label: Screenshot / Referensi
      description: Screenshot kondisi saat ini, desain, atau mockup.
